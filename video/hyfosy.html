<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HyFoSy · Video instructivo</title>
<style>
  :root { --bg:#1B1420; --panel:#2B1E2E; --line:#42303F; --ink:#F3E9EF; --muted:#BBA1BC; --accent:#B7679C; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Segoe UI",Roboto,"Helvetica Neue","Liberation Sans",Arial,sans-serif; }
  main { width:min(1280px,100%); margin:0 auto; padding:16px; }
  h1 { font-size:17px; font-weight:600; margin:4px 0 12px; color:var(--muted); }
  .stage { width:100%; aspect-ratio:16/9; background:#000; border-radius:10px; overflow:hidden; }
  canvas { width:100%; height:100%; display:block; }
  .controls { display:flex; gap:10px; align-items:center; margin-top:10px; }
  button { background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:8px 12px; font:inherit; font-size:14px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button[aria-pressed="false"] { opacity:.55; }
  input[type=range] { flex:1; min-width:0; accent-color:var(--accent); }
  .time { font-variant-numeric:tabular-nums; color:var(--muted); font-size:14px; white-space:nowrap; }
  .chapters { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .chapters button { font-size:13px; padding:5px 9px; }
  .chapters button.on { border-color:var(--accent); color:var(--accent); }
  body.render main { padding:0; width:1280px; }
  body.render h1, body.render .controls, body.render .chapters { display:none; }
  body.render .stage { border-radius:0; width:1280px; height:720px; }
</style>
</head>
<body>
<main>
  <h1>HyFoSy — Histerosalpingo-sonografía con espuma · Video instructivo para pacientes</h1>
  <div class="stage"><canvas id="cv" width="1280" height="720"></canvas></div>
  <div class="controls">
    <button id="play" title="Reproducir / pausar (barra espaciadora)">▶ Reproducir</button>
    <input id="seek" type="range" min="0" step="0.01" value="0" aria-label="Posición del video">
    <span class="time" id="time">0:00 / 0:00</span>
    <button id="cc" aria-pressed="true" title="Subtítulos (tecla C)">CC</button>
    <button id="fs" title="Pantalla completa (tecla F)">⛶</button>
  </div>
  <div class="chapters" id="chapters"></div>
</main>

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const easeOut = x => { x = clamp(x); return 1 - Math.pow(1 - x, 3); };
const seg = (t, a, b) => clamp((t - a) / (b - a));
function rng(seed) {
  return () => {
    seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const font = (size, weight = 400) => `${weight} ${size}px ${FONT}`;
function text(s, x, y, o = {}) {
  X.save();
  X.font = font(o.size || 24, o.weight || 400);
  X.fillStyle = o.color || C.ink;
  X.textAlign = o.align || 'left';
  X.textBaseline = o.base || 'alphabetic';
  if (o.alpha != null) X.globalAlpha *= o.alpha;
  X.fillText(s, x, y);
  X.restore();
}
function wrap(s, maxW, size, weight = 400) {
  X.save();
  X.font = font(size, weight);
  const lines = [];
  let cur = '';
  for (const w of s.split(' ')) {
    const test = cur ? cur + ' ' + w : w;
    if (X.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; } else cur = test;
  }
  if (cur) lines.push(cur);
  X.restore();
  return lines;
}
function para(s, x, y, maxW, o = {}) {
  const size = o.size || 24, lh = o.lh || size * 1.32;
  const lines = wrap(s, maxW, size, o.weight || 400);
  lines.forEach((l, i) => text(l, x, y + i * lh, o));
  return lines.length * lh;
}
function textWidth(s, size, weight = 400) {
  X.save(); X.font = font(size, weight); const w = X.measureText(s).width; X.restore(); return w;
}
function emoji(e, x, y, size, alpha = 1) {
  X.save();
  X.globalAlpha *= alpha;

  X.textBaseline = 'middle';
  X.fillText(e, x, y);
  X.restore();
}
function rrect(x, y, w, h, r) { X.beginPath(); X.roundRect(x, y, w, h, r); }
function card(x, y, w, h, o = {}) {
  X.save();

  X.shadowColor = 'rgba(60,40,30,0.12)'; X.shadowBlur = 18; X.shadowOffsetY = 6;

function bullet(e, s, x, y, maxW, a, o = {}) {
  if (a <= 0) return 0;

  X.globalAlpha *= a;

const TUBE_CP = [[70,-80],[112,-92],[170,-120],[236,-124],[292,-102],[326,-58],[324,-8],[302,24]];
// Curva suave (Catmull-Rom) que pasa por los puntos de control.
function catmull(P, n) {
  const p = [];
  for (let i = 0; i < P.length - 1; i++) {
    const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(P.length - 1, i + 2)];
    for (let j = 0; j < n; j++) {
      const t = j / n, t2 = t * t, t3 = t2 * t;
      const f = k => 0.5 * (2 * p1[k] + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3);
      p.push([f(0), f(1)]);
    }
  }
  p.push(P[P.length - 1]);
  return p;
}
const TUBE = (() => {
  const p = catmull(TUBE_CP, 16);
  const L = [0];
  for (let i = 1; i < p.length; i++) L.push(L[i - 1] + Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]));
  const tot = L[L.length - 1];
  return { p, u: L.map(l => l / tot) };
})();
function tubeAt(u) {
  u = clamp(u);
  const { p, u: U } = TUBE;
  let i = 1;
  while (i < U.length - 1 && U[i] < u) i++;
  const k = (u - U[i - 1]) / ((U[i] - U[i - 1]) || 1);
  return [lerp(p[i - 1][0], p[i][0], k), lerp(p[i - 1][1], p[i][1], k)];
}

  for (let i = 1; i < p.length; i++) {

    const a = U[i - 1] < u0 ? tubeAt(u0) : p[i - 1];

  for (const side of [-1, 1]) strokeTube(side, 0, 1, u => tubeW(u) * 0.38, C.cavity);

    X.save(); X.globalAlpha *= o.speculum;
    X.strokeStyle = '#7D8B96'; X.lineWidth = 5; X.lineCap = 'round';
    X.beginPath(); X.moveTo(-30, 290); X.lineTo(-38, 185); X.moveTo(30, 290); X.lineTo(38, 185); X.stroke();
    X.fillStyle = 'rgba(160,175,186,0.35)';

  }

  // Espuma en trompas, obstrucciones y derrame peritoneal

    if (blk[key] != null && reach >= stop) {

      }
    }
    const m = o.marks && o.marks[key];
    if (m) {
      const a = clamp(o.marksAlpha == null ? 1 : o.marksAlpha);
      X.save(); X.globalAlpha *= a;
      if (m === 'ok') checkMark(side * 250, -150, 1.1, s); else crossMark(side * 250, -150, 1.1, s);

    else { [ex, ey] = tubeAt(lerp(1, meet, ease((F - 0.35) / 0.4))); }

      const gk = ease((F - 0.75) / 0.25);
      X.save(); X.globalAlpha *= gk * (0.6 + 0.4 * Math.sin(t * 5));
      X.beginPath(); X.arc(ex, ey, 22 + 6 * gk, 0, Math.PI * 2); X.fillStyle = 'rgba(224,165,38,0.35)'; X.fill();
      X.restore();
    }
    X.beginPath(); X.arc(ex, ey, 11, 0, Math.PI * 2); X.fillStyle = 'rgba(255,232,163,0.55)'; X.fill();
    X.beginPath(); X.arc(ex, ey, 7, 0, Math.PI * 2); X.fillStyle = '#FFE08A'; X.fill(); X.lineWidth = 2; X.strokeStyle = C.gold; X.stroke();
    for (let i = 0; i < 6; i++) {
      const k = clamp((F - 0.05 - i * 0.04) / 0.7);
      if (k <= 0) continue;
      let sx, sy, dx, dy;
      if (k < 0.45) {
        const q = ease(k / 0.45);
        sx = lerp((i - 2.5) * 6, 70, q); sy = lerp(150, -80, q);
        dx = 70 - (i - 2.5) * 6; dy = -230;
      } else {
        const u = lerp(0, meet - 0.03 - i * 0.012, ease((k - 0.45) / 0.55));
        [sx, sy] = tubeAt(u);
        const [nx, ny] = tubeAt(u + 0.01); dx = nx - sx; dy = ny - sy;
      }
      const n = Math.hypot(dx, dy) || 1; dx /= n; dy /= n;
      X.strokeStyle = '#3E5566'; X.lineWidth = 1.3;
      X.beginPath(); X.moveTo(sx, sy);
      for (let q = 1; q <= 6; q++) {
        const wob = Math.sin(t * 18 + q + i) * 2;

      }
      X.stroke();
      X.beginPath(); X.ellipse(sx, sy, 3.2, 2.2, Math.atan2(dy, dx), 0, Math.PI * 2); X.fillStyle = '#3E5566'; X.fill();
    }
  }

  // Rótulos
  if (o.labels) {
    for (const L of o.labels) {

      if (a <= 0) continue;
      X.save(); X.globalAlpha *= a;
      const [ax, ay] = L.a, [lx, ly] = L.p;

      X.textAlign = right ? 'right' : 'left';
      X.fillText(L.t, lx + (right ? -8 : 8) / s, ly);
      X.restore();
    }
  }
  X.restore();
}

function polyUpTo(pts, k) {
  const L = [0];
  for (let i = 1; i < pts.length; i++) L.push(L[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const target = L[L.length - 1] * clamp(k);
  X.beginPath(); X.moveTo(pts[0][0], pts[0][1]);
  let end = pts[0];
  for (let i = 1; i < pts.length; i++) {
    if (L[i] <= target) { X.lineTo(pts[i][0], pts[i][1]); end = pts[i]; continue; }
    const q = (target - L[i - 1]) / (L[i] - L[i - 1]);
    end = [lerp(pts[i - 1][0], pts[i][0], q), lerp(pts[i - 1][1], pts[i][1], q)];
    X.lineTo(end[0], end[1]);
    break;
  }
  return end;
}

      para('* Ensayo FOAM (van Welie et al., Hum Reprod 2022; 1.160 mujeres): tasa de recién nacido vivo a 12 meses comparable (46\u00a0% vs. 47\u00a0%) y menos dolor con HyFoSy (EVA 3,0 vs. 5,4).', 170, 530, 950, { size: 17, color: C.muted });
      X.restore();
    },
  },
  {
    id: 'despues', chapter: 'Después',
    visual: 'Tarjetas: actividades normales, molestias esperables y signos de alarma (fiebre, dolor intenso, flujo de mal olor).',
    lines: [
      'Después del examen puede retomar sus actividades habituales. Es normal sentir un cólico leve y tener algo de flujo o manchado durante uno o dos días.',
      'Consulte de inmediato si presenta fiebre, dolor abdominal intenso o flujo de mal olor, porque pueden ser signos de una infección, que es una complicación poco frecuente.',
    ],
    draw(t, d, L) {
      title('Después del examen', 100, 110, ease(seg(t, 0, 0.8)));
      const items = [
        ['🙂', 'Actividades habituales el mismo día', null, L[0] + 0.5],
        ['💧', 'Cólico leve y flujo o manchado por 1–2 días: es esperable', null, L[0] + 3.5],
        ['🌡️', 'Consulte si tiene fiebre, dolor intenso o flujo de mal olor', C.bad, L[1] + 0.4],
      ];
      items.forEach(([e, s, col, at], i) => {
        const k = easeOut(seg(t, at, at + 0.8));
        if (k <= 0) return;
        const y = 150 + i * 125 + (1 - k) * 18;
        card(150, y, 980, 100, { alpha: k, stroke: col ? '#EBA7AC' : null, fill: col ? '#FFF3F3' : C.card });
        X.save(); X.globalAlpha *= k;
        emoji(e, 205, y + 50, 40);
        text(s, 255, y + 59, { size: 25, weight: col ? 700 : 600, color: col || C.ink });
        X.restore();
      });
    },
  },
  {
    id: 'resumen', chapter: 'Resumen',
    visual: 'Resumen en tres ideas y aviso: material educativo que no reemplaza la consulta médica.',
    lines: [
      'En resumen: la HyFoSy es un examen ambulatorio y sin radiación que, en pocos minutos, muestra si sus trompas están abiertas.',
      'Si tiene dudas, consulte con su equipo tratante. Gracias por su atención.',
    ],
    tail: 1.2,
    draw(t, d, L) {
      title('En resumen', 640, 130, ease(seg(t, 0, 0.8)), { align: 'center', color: C.teal, size: 44 });
      const a = ease(seg(t, 0.6, 1.4));
      text('Ecografía + espuma  →  ¿trompas abiertas?', 640, 205, { size: 32, weight: 700, align: 'center', alpha: a });
      const chips = [['🛡️', 'Sin radiación'], ['🏥', 'Ambulatorio, 10–20 min'], ['⚡', 'Resultado inmediato']];
      chips.forEach(([e, s], i) => {
        const k = easeOut(seg(t, 1.8 + i * 1.2, 2.6 + i * 1.2));
        if (k <= 0) return;
        const x = 150 + i * 340, y = 260 + (1 - k) * 18;
        card(x, y, 310, 130, { alpha: k });
        X.save(); X.globalAlpha *= k;
        emoji(e, x + 155, y + 46, 38);
        text(s, x + 155, y + 104, { size: 22, weight: 700, align: 'center' });
        X.restore();
      });
      X.save(); X.globalAlpha *= ease(seg(t, L[1], L[1] + 1));
      para('Material educativo. No reemplaza la evaluación ni las indicaciones de su médico tratante.', 640, 452, 900, { size: 18, color: C.muted, align: 'center' });
      X.restore();
    },
  },
  {
    id: 'creditos', chapter: 'Créditos',
    visual: 'Escena de cierre: fotografía circular de la Dra. Karina Castillo, su nombre, especialidad y su usuario de Instagram.',
    lines: [
      'Este material fue producido por la Dra. Karina Castillo, ginecóloga.',
      'Sígala en Instagram como arroba drkarinacastillogine.',
    ],
    tail: 2,
    draw(t, d, L) {
      // Fondo con círculos decorativos suaves, en tono violeta/rosa
      for (const [cx, cy, r, c] of [[1180, 90, 220, C.tealSoft], [70, 650, 260, C.roseWall], [1220, 640, 160, C.tealSoft]]) {
        X.save(); X.globalAlpha *= 0.55;
        X.beginPath(); X.arc(cx, cy, r, 0, Math.PI * 2); X.fillStyle = c; X.fill();
        X.restore();
      }
      const pa = easeOut(seg(t, 0.2, 1.1));
      const cx = 330, cy = 300, R = 148;
      if (pa > 0) {
        X.save(); X.globalAlpha *= pa;
        X.save();
        X.shadowColor = 'rgba(120,60,100,0.28)'; X.shadowBlur = 34; X.shadowOffsetY = 10;
        X.beginPath(); X.arc(cx, cy, R + 8, 0, Math.PI * 2); X.fillStyle = '#FFFFFF'; X.fill();
        X.restore();
        X.beginPath(); X.arc(cx, cy, R + 8, 0, Math.PI * 2);
        X.strokeStyle = C.rose; X.lineWidth = 6; X.stroke();
        X.save();
        X.beginPath(); X.arc(cx, cy, R, 0, Math.PI * 2); X.clip();
        if (doctorImg) {
          const s = Math.max((R * 2) / doctorImg.width, (R * 2) / doctorImg.height);
          const iw = doctorImg.width * s, ih = doctorImg.height * s;
          X.drawImage(doctorImg, cx - iw / 2, cy - ih / 2, iw, ih);
        } else {
          const g = X.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
          g.addColorStop(0, C.teal); g.addColorStop(1, C.roseDeep);
          X.fillStyle = g; X.fillRect(cx - R, cy - R, R * 2, R * 2);
          text('KC', cx, cy + 2, { size: 92, weight: 800, color: 'rgba(255,255,255,0.92)', align: 'center', base: 'middle' });
        }
        X.restore();
        X.restore();
      }
      const na = ease(seg(t, 1, 1.8));
      X.save(); X.globalAlpha *= na;
      text('Dra. Karina Castillo', 560, 250, { size: 42, weight: 800, color: C.ink });
      text('Ginecóloga', 560, 292, { size: 26, weight: 600, color: C.roseDeep });
      X.restore();
      const ia = ease(seg(t, L[1] + 0.2, L[1] + 1));
      if (ia > 0) {
        X.save(); X.globalAlpha *= ia;
        const label = '@drkarinacastillogine';
        const w = textWidth(label, 24, 700) + 76;
        card(560, 330, w, 56, { r: 28 });
        emoji('📷', 596, 358, 26);
        text(label, 624, 366, { size: 24, weight: 700, color: C.teal, base: 'middle' });
        X.restore();
      }
      const fa = ease(seg(t, L[0] + 0.3, L[0] + 1.1));
      X.save(); X.globalAlpha *= fa;
      para('Material educativo elaborado para pacientes en estudio de fertilidad.', 560, 420, 560, { size: 19, color: C.muted });
      X.restore();
    },
  },
];

// Tiempos: inicio de escena, inicio de cada subtítulo, duración.
const LEAD = 0.7, GAP = 0.25;
let TOTAL = 0;
for (const sc of SCENES) {
  sc.start = TOTAL;
  sc.L = []; sc.segs = [];
  let lt = LEAD;
  for (const line of sc.lines) {
    const words = line.split(/\s+/).length;
    const dur = Math.max(3, words * 0.38 + 0.8);
    sc.L.push(lt);
    sc.segs.push([lt, lt + dur - GAP]);
    lt += dur;
  }
  sc.dur = lt + (sc.tail || 1.2);
  TOTAL += sc.dur;
}

// ── Composición de un cuadro ─────────────────────────────────────────────────
function sceneAt(t) {
  for (const sc of SCENES) if (t < sc.start + sc.dur) return sc;
  return SCENES[SCENES.length - 1];
}
let showCC = true;
function renderAt(tg) {
  tg = clamp(tg, 0, TOTAL - 1e-3);
  const sc = sceneAt(tg), t = tg - sc.start, d = sc.dur;
  X.save();
  const bg = X.createRadialGradient(W * 0.3, H * 0.2, 50, W * 0.5, H * 0.5, W * 0.8);
  bg.addColorStop(0, '#FFFCF9'); bg.addColorStop(1, C.bg2);
  X.fillStyle = bg; X.fillRect(0, 0, W, H);

  const fade = Math.min(ease(t / 0.5), ease((d - t) / 0.5));
  X.save(); X.globalAlpha = fade;
  sc.draw(t, d, sc.L);
  X.restore();

  // Encabezado
  if (sc.id !== 'titulo') {
    X.save(); X.globalAlpha = fade;
    const w = textWidth(sc.chapter, 16, 700) + 28;
    rrect(40, 26, w, 32, 16); X.fillStyle = C.teal; X.fill();
    text(sc.chapter, 40 + w / 2, 48, { size: 16, weight: 700, color: '#fff', align: 'center' });
    text('HyFoSy · Guía para pacientes', W - 40, 48, { size: 15, weight: 600, color: C.muted, align: 'right' });
    X.restore();
  }

  // Subtítulos
  if (showCC) {
    sc.segs.forEach(([a, b], i) => {
      if (t < a || t > b) return;
      const al = Math.min(clamp((t - a) / 0.2), clamp((b - t) / 0.2));
      const lines = wrap(sc.lines[i], 1060, 25, 500);
      const lh = 34, h = lines.length * lh + 22;
      const w = Math.max(...lines.map(l => textWidth(l, 25, 500))) + 48;
      X.save(); X.globalAlpha = al;
      rrect((W - w) / 2, H - 26 - h, w, h, 12); X.fillStyle = 'rgba(22,30,37,0.86)'; X.fill();
      lines.forEach((l, k) => text(l, W / 2, H - 26 - h + 36 + k * lh, { size: 25, weight: 500, color: '#FFFFFF', align: 'center' }));
      X.restore();
    });
  }

  // Barra de progreso
  X.fillStyle = 'rgba(148,87,160,0.25)'; X.fillRect(0, H - 5, W, 5);
  X.fillStyle = C.teal; X.fillRect(0, H - 5, W * (tg / TOTAL), 5);
  X.restore();
}

// API para exportar (scripts/render.mjs)
window.HYFOSY = {
  TOTAL,
  scenes: SCENES.map(s => ({ id: s.id, chapter: s.chapter, visual: s.visual, start: s.start, dur: s.dur,
    lines: s.lines.map((text, i) => ({ text, start: s.start + s.segs[i][0], end: s.start + s.segs[i][1] })) })),
  frame(t, q = 0.92) { renderAt(t); return cv.toDataURL('image/jpeg', q); },
  ready: doctorImgReady,
};

// ── Reproductor ──────────────────────────────────────────────────────────────
if (RENDER) {
  document.body.classList.add('render');
  doctorImgReady.then(() => renderAt(0));
} else {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = W * dpr; cv.height = H * dpr;
  X.setTransform(dpr, 0, 0, dpr, 0, 0);
  const $ = id => document.getElementById(id);
  const playBtn = $('play'), seek = $('seek'), time = $('time'), ccBtn = $('cc');
  seek.max = TOTAL;
  let cur = 0, playing = false, last = 0;
  const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  const chapters = $('chapters');
  const chapBtns = SCENES.map(sc => {
    const b = document.createElement('button');
    b.textContent = sc.chapter;
    b.onclick = () => { cur = sc.start + 0.01; draw(); };
    chapters.appendChild(b);
    return b;
  });
  function draw() {
    renderAt(cur);
    seek.value = cur;
    time.textContent = `${fmt(cur)} / ${fmt(TOTAL)}`;
    const sc = sceneAt(cur);
    chapBtns.forEach((b, i) => b.classList.toggle('on', SCENES[i] === sc));
  }
  function loop(now) {
    if (!playing) return;
    cur += (now - last) / 1000; last = now;
    if (cur >= TOTAL) { cur = TOTAL; setPlaying(false); }
    draw();
    requestAnimationFrame(loop);
  }
  function setPlaying(p) {
    playing = p;
    playBtn.textContent = p ? '❚❚ Pausa' : '▶ Reproducir';
    if (p) { if (cur >= TOTAL - 0.05) cur = 0; last = performance.now(); requestAnimationFrame(loop); }
  }
  playBtn.onclick = () => setPlaying(!playing);
  seek.oninput = () => { cur = +seek.value; draw(); };
  ccBtn.onclick = () => { showCC = !showCC; ccBtn.setAttribute('aria-pressed', showCC); draw(); };
  $('fs').onclick = () => (document.fullscreenElement ? document.exitFullscreen() : document.querySelector('.stage').requestFullscreen());
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
    else if (e.key === 'c' || e.key === 'C') ccBtn.click();
    else if (e.key === 'f' || e.key === 'F') $('fs').click();
    else if (e.key === 'ArrowRight') { cur = Math.min(TOTAL, cur + 5); draw(); }
    else if (e.key === 'ArrowLeft') { cur = Math.max(0, cur - 5); draw(); }
  });
  Promise.all([document.fonts ? document.fonts.ready : Promise.resolve(), doctorImgReady]).then(draw);
  draw();
}
</script>
